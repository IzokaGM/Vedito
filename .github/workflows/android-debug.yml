name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"

      - name: Bootstrap React Native 0.87.1 native project
        run: |
          rm -rf VECEditor
          npx --yes @react-native-community/cli@latest init VECEditor --version 0.87.1 --skip-install

      - name: Overlay VEC app source
        run: |
          rm -rf VECEditor/src
          cp -R src VECEditor/src
          cp App.tsx app.json index.js babel.config.js metro.config.js tsconfig.json VECEditor/

          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const nativePath = 'VECEditor/package.json';
          const native = JSON.parse(fs.readFileSync(nativePath, 'utf8'));
          native.dependencies = {...native.dependencies, ...app.dependencies};
          native.devDependencies = {...native.devDependencies, ...app.devDependencies};
          fs.writeFileSync(nativePath, JSON.stringify(native, null, 2) + '\n');
          NODE

      - name: Install dependencies
        working-directory: VECEditor
        run: npm install --no-audit --no-fund

      - name: Type check
        working-directory: VECEditor
        run: npx tsc --noEmit

      - name: Build debug APK
        working-directory: VECEditor/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VECEditor-debug-apk
          path: VECEditor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
